server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: "json_logs"
          __path__: /logs/logs.txt  # Path inside the container
    pipeline_stages:
      - json:
          expressions:
            msg: "message"
            height: "height"
            round: "round"
      - json:
          expressions:
            time: "vote_time"
            validator: "valaddr"
            vote_type: "vote_type"
      - json:
          expressions:
            time: "proposal_time"
      - labels:
          msg:
          height:
          round:
          vote_type:
      - drop:
          source: msg
          expression: "(msg != 'Vote' and msg != 'Proposal')"
